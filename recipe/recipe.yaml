context:
  version: "0.0.3"

package:
  name: enum-compat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/enum-compat/enum-compat-${{ version }}.tar.gz
  sha256: 3677daabed56a6f724451d585662253d8fb4e5569845aafa8bb0da36b1a8751e

build:
  number: 8
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - enum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jstasiak/enum-compat
  license: MIT
  license_file: LICENSE.txt
  summary: This is a virtual package, its whole purpose is to install enum34 on Python older than 3.4. On Python 3.4+ it’s a no-op.
  documentation: https://github.com/jstasiak/enum-compat/blob/master/README.rst
  repository: https://github.com/jstasiak/enum-compat

extra:
  recipe-maintainers:
    - trendelkampschroer
